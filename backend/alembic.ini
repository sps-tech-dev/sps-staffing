# Alembic config for SPS platform. The DB URL is NOT set here — env.py reads it
# from the app's settings (DB_HOST/PORT/NAME/USER/PASSWORD), so the same config
# works locally and in the ECS migrate task with no hardcoded credentials.
[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is set programmatically in env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
