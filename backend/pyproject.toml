[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sps-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "boto3>=1.35",
  "python-jose[cryptography]>=3.3",
  "argon2-cffi>=23.1",
  # Resume text extraction (B.1) — pure-Python, ARM64-safe on the slim base.
  "pdfminer.six>=20240706",
  "python-docx>=1.1",
  "docx2txt>=0.8",
  # Invoice PDF (B.9) — pure-Python capable, ARM64-safe
  "reportlab>=4.2",
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "moto[s3]>=5"]

[tool.setuptools.packages.find]
include = ["app*"]
